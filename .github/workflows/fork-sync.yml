name: Automatic Fork Sync

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC / 08:00 Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          output=$(
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/merge-upstream" \
              -f branch=master 2>&1
          )
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "$output"
            exit 0
          fi

          if echo "$output" | grep -Fq 'without `workflows` permission'; then
            echo "::warning::Upstream sync includes workflow file changes that GITHUB_TOKEN cannot apply without workflows permission. Skipping automatic sync for this run."
            echo "$output"
            exit 0
          fi

          echo "$output"
          exit $status
